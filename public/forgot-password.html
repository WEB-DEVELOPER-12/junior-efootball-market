<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Junior eFootball Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #4a76a8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #4a76a8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            color: #4a76a8;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter the email address connected to your Junior eFootball Market account.
        </p>

        <form id="forgotForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

        <div id="message"></div>

        <div class="links">
            <a href="/login.html">← Back to Login</a>
        </div>

        <div class="security">
            🔒 <strong>Security:</strong>
            Never share your password, M-Pesa PIN, OTP, or other security codes with anyone.
        </div>

    </div>

    <script>
        const forgotForm = document.getElementById("forgotForm");
        const message = document.getElementById("message");

        forgotForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            message.textContent = "Processing...";
            message.style.color = "#333";

            try {
                const response = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = data.message;
                    message.style.color = "green";
                    forgotForm.reset();
                } else {
                    message.textContent = data.message || "Something went wrong.";
                    message.style.color = "red";
                }

            } catch (error) {
                message.textContent = "Could not connect to the server.";
                message.style.color = "red";
            }
        });
    </script>

</body>
</html>
