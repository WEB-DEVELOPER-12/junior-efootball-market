<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Junior eFootball Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #4a76a8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #4a76a8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            color: #4a76a8;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Create New Password</h1>

        <p class="subtitle">
            Enter your new password below.
        </p>

        <form id="resetForm">

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit" id="resetButton">
                Change Password
            </button>

        </form>

        <div id="message"></div>

        <div class="links">
            <a href="/login.html">← Back to Login</a>
        </div>

        <div class="security">
            🔒 <strong>Security:</strong>
            Use a password that you do not share with other people.
        </div>

    </div>

    <script>
        const resetForm = document.getElementById("resetForm");
        const resetButton = document.getElementById("resetButton");
        const message = document.getElementById("message");

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        if (!token) {
            resetButton.disabled = true;
            message.textContent =
                "This password reset link is missing or invalid.";
            message.style.color = "red";
        }

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!token) {
                return;
            }

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                message.textContent =
                    "Password must be at least 8 characters long.";
                message.style.color = "red";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent =
                    "Passwords do not match.";
                message.style.color = "red";
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Changing Password...";
            message.textContent = "";

            try {
                const response = await fetch(
                    "/api/reset-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token,
                            password,
                            confirmPassword
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    message.textContent = data.message;
                    message.style.color = "green";

                    resetForm.reset();

                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 1500);

                } else {
                    message.textContent =
                        data.message ||
                        "Could not reset your password.";
                    message.style.color = "red";

                    resetButton.disabled = false;
                    resetButton.textContent = "Change Password";
                }

            } catch (error) {
                console.error(error);

                message.textContent =
                    "Could not connect to the server.";
                message.style.color = "red";

                resetButton.disabled = false;
                resetButton.textContent = "Change Password";
            }
        });
    </script>

</body>
</html>
