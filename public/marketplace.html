<title>Marketplace | Junior eFootball Market</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #222;
    }

        color: white;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .brand {

        font-weight: bold;

    nav {
        display: flex;

        font-size: 14px;

    nav a:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    .container {
        width: 100%;
        max-width: 1150px;
        margin: auto;
        padding: 30px 20px;
    }

    .top-section {
        background: white;
        padding: 25px;
        border-radius: 14px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        margin-bottom: 25px;
    }

    .top-section h1 {

<body>

```
<header>

    <div class="brand">
        ⚽ Junior eFootball Market
    </div>

    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/marketplace.html">Marketplace</a>
        <a href="/login.html">Login</a>
    </nav>

</header>

<main class="container">

    <section class="top-section">

        <h1>Marketplace</h1>

        <p>
            Browse eFootball gaming advertisements from marketplace users.
        </p>

        <div class="controls">

            <input
                type="search"
                id="searchInput"
                placeholder="Search advertisements..."
            >

            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Players">Players</option>
                <option value="Teams">Teams</option>
                <option value="Gaming Services">Gaming Services</option>
                <option value="Other">Other</option>
            </select>

        </div>

    </section>

    <div class="loading" id="loading">
        Loading advertisements...
    </div>

    <section class="listings" id="listings"></section>

    <div class="empty" id="empty">
        <h3>No advertisements found</h3>
        <p>
            There are currently no advertisements matching your search.
        </p>
    </div>

</main>

<script>
    const listingsContainer = document.getElementById("listings");
    const loading = document.getElementById("loading");
    const empty = document.getElementById("empty");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");

    let allListings = [];

    async function loadListings() {
        loading.style.display = "block";
        listingsContainer.innerHTML = "";
        empty.style.display = "none";

        try {
            const response = await fetch("/api/listings");

            if (!response.ok) {
                throw new Error("Could not load listings.");
            }

            const data = await response.json();

            if (data.success) {
                allListings = data.listings || [];
                displayListings(allListings);
            } else {
                throw new Error(
                    data.message || "Could not load listings."
                );
            }

        } catch (error) {
            console.error("Marketplace error:", error);

            loading.textContent =
                "Could not load advertisements. Please try again.";
        } finally {
            if (allListings.length > 0) {
                loading.style.display = "none";
            }
        }
    }

    function displayListings(listings) {
        loading.style.display = "none";
        listingsContainer.innerHTML = "";

        if (listings.length === 0) {
            empty.style.display = "block";
            return;
        }

        empty.style.display = "none";

        listings.forEach((listing) => {

            const card = document.createElement("article");
            card.className = "listing-card";

            const imageArea = document.createElement("div");
            imageArea.className = "listing-image";
            imageArea.textContent = "⚽";

            const content = document.createElement("div");
            content.className = "listing-content";

            const category = document.createElement("span");
            category.className = "category";
            category.textContent = listing.category;

            const title = document.createElement("h3");
            title.textContent = listing.title;

            const description = document.createElement("p");
            description.className = "description";
            description.textContent = listing.description;

            const price = document.createElement("div");
            price.className = "price";
            price.textContent =
                "KSh " + Number(listing.price).toLocaleString();

            const seller = document.createElement("div");
            seller.className = "seller";
            seller.textContent =
                "Seller: " + listing.username;

            const button = document.createElement("button");
            button.className = "view-button";
            button.textContent = "View Advertisement";

            button.addEventListener("click", () => {
                window.location.href =
                    "/listing.html?id=" + listing.id;
            });

            content.appendChild(category);
            content.appendChild(title);
            content.appendChild(description);
            content.appendChild(price);
            content.appendChild(seller);
            content.appendChild(button);

            card.appendChild(imageArea);
            card.appendChild(content);

            listingsContainer.appendChild(card);
        });
    }

    function filterListings() {
        const search = searchInput.value.toLowerCase().trim();
        const category = categoryFilter.value;

        const filtered = allListings.filter((listing) => {

            const matchesSearch =
                listing.title.toLowerCase().includes(search) ||
                listing.description.toLowerCase().includes(search) ||
                listing.username.toLowerCase().includes(search);

            const matchesCategory =
                !category ||
                listing.category === category;

            return matchesSearch && matchesCategory;
        });

        displayListings(filtered);
    }

    searchInput.addEventListener("input", filterListings);
    categoryFilter.addEventListener("change", filterListings);

    loadListings();
</script>
