<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertisement Details - Junior eFootball Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 18px 20px;
        }

        header .top {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            font-size: 22px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,.6);
            padding: 9px 14px;
            border-radius: 8px;
        }

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .image-container {
            width: 100%;
            background: #e9eef5;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            display: block;
        }

        .no-image {
            color: #667085;
            padding: 80px 20px;
            text-align: center;
            font-size: 18px;
        }

        .content {
            padding: 28px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .seller {
            color: #667085;
            margin-bottom: 22px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #0b5ed7;
            margin-bottom: 20px;
        }

        .description {
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .detail {
            background: #f5f7fa;
            padding: 14px;
            border-radius: 10px;
        }

        .detail strong {
            display: block;
            margin-bottom: 5px;
            color: #344054;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button,
        .action-link {
            border: none;
            background: #0b5ed7;
            color: white;
            padding: 13px 20px;
            border-radius: 9px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .whatsapp {
            background: #198754;
        }

        .message {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
        }

        @media (max-width: 650px) {
            .details {
                grid-template-columns: 1fr;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="top">
        <h1>Junior eFootball Market</h1>
        <a class="back-btn" href="/marketplace.html">← Marketplace</a>
    </div>
</header>

<main>
    <div id="loading" class="message">
        Loading advertisement...
    </div>

    <div id="error" class="message" style="display:none;">
        Advertisement not found.
    </div>

    <div id="listingCard" class="card" style="display:none;">

        <div id="imageContainer" class="image-container"></div>

        <div class="content">
            <h2 id="title"></h2>

            <div class="seller">
                Seller: <strong id="seller"></strong>
            </div>

            <div class="price">
                KSh <span id="price"></span>
            </div>

            <div class="description" id="description"></div>

            <div class="details">
                <div class="detail">
                    <strong>Category</strong>
                    <span id="category"></span>
                </div>

                <div class="detail">
                    <strong>Collective Strength</strong>
                    <span id="collectiveStrength"></span>
                </div>

                <div class="detail">
                    <strong>Team</strong>
                    <span id="teamName"></span>
                </div>

                <div class="detail">
                    <strong>Players</strong>
                    <span id="playerCount"></span>
                </div>

                <div class="detail">
                    <strong>Featured Player</strong>
                    <span id="featuredPlayer"></span>
                </div>

                <div class="detail">
                    <strong>Account Level</strong>
                    <span id="accountLevel"></span>
                </div>

                <div class="detail">
                    <strong>Platform</strong>
                    <span id="platform"></span>
                </div>
            </div>

            <div class="actions">
                <a
                    class="action-link whatsapp"
                    href="https://wa.me/254745869096"
                    target="_blank"
                    rel="noopener"
                >
                    Contact Junior on WhatsApp
                </a>

                <a
                    class="action-link"
                    href="/chat.html"
                >
                    Private Chat
                </a>
            </div>
        </div>
    </div>
</main>

<script>
    function getListingId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("id");
    }

    function showError(message) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("listingCard").style.display = "none";

        const error = document.getElementById("error");
        error.textContent = message;
        error.style.display = "block";
    }

    function displayValue(value) {
        return value !== null &&
               value !== undefined &&
               value !== ""
            ? value
            : "Not provided";
    }

    async function loadListing() {
        const listingId = getListingId();

        if (!listingId) {
            showError("No advertisement was selected.");
            return;
        }

        try {
            const response = await fetch("/api/listings");

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error("Could not load advertisements.");
            }

            const listing = data.listings.find(
                item => String(item.id) === String(listingId)
            );

            if (!listing) {
                showError("Advertisement not found.");
                return;
            }

            document.getElementById("title").textContent =
                displayValue(listing.title);

            document.getElementById("seller").textContent =
                displayValue(listing.username);

            document.getElementById("price").textContent =
                Number(listing.price).toLocaleString();

            document.getElementById("description").textContent =
                displayValue(listing.description);

            document.getElementById("category").textContent =
                displayValue(listing.category);

            document.getElementById("collectiveStrength").textContent =
                displayValue(listing.collective_strength);

            document.getElementById("teamName").textContent =
                displayValue(listing.team_name);

            document.getElementById("playerCount").textContent =
                displayValue(listing.player_count);

            document.getElementById("featuredPlayer").textContent =
                displayValue(listing.featured_player);

            document.getElementById("accountLevel").textContent =
                displayValue(listing.account_level);

            document.getElementById("platform").textContent =
                displayValue(listing.platform);

            const imageContainer =
                document.getElementById("imageContainer");

            if (listing.image) {
                const img = document.createElement("img");

                img.src = listing.image;
                img.alt = listing.title || "Advertisement image";

                img.onerror = function () {
                    imageContainer.innerHTML =
                        '<div class="no-image">Image could not be loaded.</div>';
                };

                imageContainer.appendChild(img);
            } else {
                imageContainer.innerHTML =
                    '<div class="no-image">No image was uploaded for this advertisement.</div>';
            }

            document.getElementById("loading").style.display = "none";
            document.getElementById("listingCard").style.display = "block";

        } catch (error) {
            console.error(error);
            showError("Could not load this advertisement.");
        }
    }

    loadListing();
</script>

</body>
</html>
